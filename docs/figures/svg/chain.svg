<svg class="vz" viewBox="0 0 460 118" role="img" xmlns="http://www.w3.org/2000/svg"><title>研究框架：宏观状态和资产配置之间，隔着市场预期这一环</title><desc>四个方框从左到右：宏观数据、宏观状态、市场预期、资产配置。市场预期这一环被强调。</desc><style>.vz text{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0F2340;}.vz .t2{fill:#3D5371;}.vz .t3{fill:#55697F;}.vz .grid{stroke:#DDE3EA;stroke-width:1;}.vz .base{stroke:#A7B4C2;stroke-width:1;}</style><rect x="0.0" y="8" width="106.0" height="58" rx="6" fill="#F4F6F8" stroke="#A7B4C2" stroke-width="1"/><text x="53.0" y="30.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="600">宏观数据</text><text x="53.0" y="49.0" font-size="10" text-anchor="middle" dominant-baseline="middle" class="t2">按首次公布日对齐</text><path d="M107.0,37.0h8.0" stroke="#55697F" stroke-width="1.4"/><path d="M113.0,33.5l4,3.5l-4,3.5" fill="none" stroke="#55697F" stroke-width="1.4"/><rect x="118.0" y="8" width="106.0" height="58" rx="6" fill="#F4F6F8" stroke="#A7B4C2" stroke-width="1"/><text x="171.0" y="30.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="600">宏观状态</text><text x="171.0" y="49.0" font-size="10" text-anchor="middle" dominant-baseline="middle" class="t2">增长、通胀的实时概率</text><path d="M225.0,37.0h8.0" stroke="#55697F" stroke-width="1.4"/><path d="M231.0,33.5l4,3.5l-4,3.5" fill="none" stroke="#55697F" stroke-width="1.4"/><rect x="236.0" y="8" width="106.0" height="58" rx="6" fill="#E3EAF2" stroke="#0F2340" stroke-width="1.5"/><text x="289.0" y="30.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="600">市场预期</text><text x="289.0" y="49.0" font-size="10" text-anchor="middle" dominant-baseline="middle" class="t2">一致预期、互换、期权</text><path d="M343.0,37.0h8.0" stroke="#55697F" stroke-width="1.4"/><path d="M349.0,33.5l4,3.5l-4,3.5" fill="none" stroke="#55697F" stroke-width="1.4"/><rect x="354.0" y="8" width="106.0" height="58" rx="6" fill="#F4F6F8" stroke="#A7B4C2" stroke-width="1"/><text x="407.0" y="30.0" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="600">资产配置</text><text x="407.0" y="49.0" font-size="10" text-anchor="middle" dominant-baseline="middle" class="t2">风险预算、固收+</text><path d="M171.0,70V86H407.0V72" fill="none" stroke="#A7B4C2" stroke-width="1.2"/><path d="M403.5,76l3.5,-4l3.5,4" fill="none" stroke="#A7B4C2" stroke-width="1.2"/><text x="230.0" y="100.0" font-size="11" text-anchor="middle" dominant-baseline="middle" class="t3">美林时钟从「宏观状态」直接跳到「资产配置」，省掉了中间这一环</text></svg>