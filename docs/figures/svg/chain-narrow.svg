<svg class="vz" viewBox="0 0 320 318" role="img" xmlns="http://www.w3.org/2000/svg"><title>研究框架：宏观状态和资产配置之间，隔着市场预期这一环</title><desc>四个方框从上到下：宏观数据、宏观状态、市场预期、资产配置。市场预期这一环被强调。</desc><style>.vz text{font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0F2340;}.vz .t2{fill:#3D5371;}.vz .t3{fill:#55697F;}.vz .grid{stroke:#DDE3EA;stroke-width:1;}.vz .base{stroke:#A7B4C2;stroke-width:1;}</style><rect x="10" y="6" width="300" height="56" rx="6" fill="#F4F6F8" stroke="#A7B4C2" stroke-width="1"/><text x="28.0" y="34.0" font-size="16" text-anchor="start" dominant-baseline="middle" font-weight="600">宏观数据</text><text x="294.0" y="34.0" font-size="13" text-anchor="end" dominant-baseline="middle" class="t2">按首次公布日对齐</text><path d="M50,65v12" stroke="#55697F" stroke-width="1.4"/><path d="M46.5,74l3.5,4l3.5,-4" fill="none" stroke="#55697F" stroke-width="1.4"/><rect x="10" y="80" width="300" height="56" rx="6" fill="#F4F6F8" stroke="#A7B4C2" stroke-width="1"/><text x="28.0" y="108.0" font-size="16" text-anchor="start" dominant-baseline="middle" font-weight="600">宏观状态</text><text x="294.0" y="108.0" font-size="13" text-anchor="end" dominant-baseline="middle" class="t2">增长、通胀的实时概率</text><path d="M50,139v12" stroke="#55697F" stroke-width="1.4"/><path d="M46.5,148l3.5,4l3.5,-4" fill="none" stroke="#55697F" stroke-width="1.4"/><rect x="10" y="154" width="300" height="56" rx="6" fill="#E3EAF2" stroke="#0F2340" stroke-width="1.5"/><text x="28.0" y="182.0" font-size="16" text-anchor="start" dominant-baseline="middle" font-weight="600">市场预期</text><text x="294.0" y="182.0" font-size="13" text-anchor="end" dominant-baseline="middle" class="t2">一致预期、利率互换、期权</text><path d="M50,213v12" stroke="#55697F" stroke-width="1.4"/><path d="M46.5,222l3.5,4l3.5,-4" fill="none" stroke="#55697F" stroke-width="1.4"/><rect x="10" y="228" width="300" height="56" rx="6" fill="#F4F6F8" stroke="#A7B4C2" stroke-width="1"/><text x="28.0" y="256.0" font-size="16" text-anchor="start" dominant-baseline="middle" font-weight="600">资产配置</text><text x="294.0" y="256.0" font-size="13" text-anchor="end" dominant-baseline="middle" class="t2">风险预算、固收+</text><text x="160.0" y="306.0" font-size="12" text-anchor="middle" dominant-baseline="middle" class="t3">美林时钟从「宏观状态」直接跳到「资产配置」</text></svg>