[project]
name = "macrob"
version = "0.1.0"
description = "宏观信息在市场价格之外，能给固收+ 组合带来什么增量：研究代码"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "akshare>=1.19.1",
    "clarabel>=0.11.1",
    "cvxpy>=1.9.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "scikit-learn>=1.9.1",
    "statsmodels>=0.15.0",
]

[project.scripts]
macrob = "macrob:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
